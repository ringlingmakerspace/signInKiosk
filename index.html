<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makerspace Sign-In</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
        }
        html.kiosk-mode, html.kiosk-mode body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            overscroll-behavior: none;
        }
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        #kiosk-wrapper {
            transform-origin: top center;
            padding-top: 40px;
            padding-bottom: 20px;
            box-sizing: border-box;
        }
        html:not(.kiosk-mode) #kiosk-wrapper {
            max-width: min(95vw, 1920px);
            margin: 0 auto;
            padding-left: 16px;
            padding-right: 16px;
        }
        span {
            visibility: hidden;
            font-size: 2px;
        }
        input {
            padding: 10px;
            font-size: 24px;
            text-align: center;
            width: 250px;
            margin-bottom: 1px;
        }
        .button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }
        button {
            padding: 15px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            color: white;
            border-radius: 5px;
            width: 30%;
            box-sizing: border-box;
        }
        @media (max-width: 480px) {
            .button-container {
                flex-direction: column;
                align-items: stretch;
            }
            .button-container button {
                width: 100%;
            }
        }
        .personal-btn  { background-color: #28a745; }
        .academic-btn  { background-color: #007BFF;}
        .work-btn      { background-color: #DC3545; }
        button:hover   { opacity: 0.8; }

        .reason-btn {
            padding: 50px 15px;
        }
        .reason-btn.selected {
            outline: 3px solid #000;
            outline-offset: 2px;
        }
        .single-select-btn {
            background-color: #6c757d;
            padding: 50px 15px;
        }
        .single-select-btn.selected {
            outline: 3px solid #000;
            outline-offset: 2px;
        }
        .answer-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }
        .answer-buttons button {
            width: 230px;
            height: 115px;
            font-size: 22px;
            font-weight: bold;
            color: ghostwhite;
            background-size: cover;
            background-position: center;
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 1.7);
        }
        .answer-buttons button.selected {
            outline: 3px solid #000;
            outline-offset: 2px;
        }
        #questionsContainer > div + div {
            margin-top: 45px;
        }
        #questionsHeader {
            display: none;
        }
        #actionRow {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            width: 95%;
            margin-left: auto;
            margin-right: auto;
        }
        #submitBtn {
            background-color: #6610f2;
            flex: 1;
            box-sizing: border-box;
            padding: 50px 15px;
        }
        #clearBtn {
            background-color: #6c757d;
            width: 110px;
            flex-shrink: 0;
            box-sizing: border-box;
            padding: 50px 15px;
        }
        #statusMsg {
            margin-top: 20px;
            font-size: 20px;
            color: green;
            min-height: 1.5em;
        }

        /* ---- Full-screen feedback overlay ---- */
        .feedback-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
            background: rgba(0,0,0,0.55);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .feedback-overlay.visible { opacity: 1; pointer-events: auto; }

        .feedback-panel {
            background: #fff;
            border-radius: 16px;
            padding: 40px 32px;
            max-width: 90vw;
            width: 480px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.35);
            text-align: center;
            transform: scale(0.85);
            transition: transform 0.25s ease;
        }
        .feedback-overlay.visible .feedback-panel { transform: scale(1); }

        .feedback-overlay.state-loading .feedback-panel { border-top: 10px solid #6610f2; }
        .feedback-overlay.state-success .feedback-panel { border-top: 10px solid #28a745; }
        .feedback-overlay.state-fail    .feedback-panel { border-top: 10px solid #DC3545; }

        .feedback-icon {
            font-size: 72px;
            line-height: 1;
            margin-bottom: 12px;
        }
        .feedback-overlay.state-loading .feedback-icon { display: none; }
        .feedback-overlay.state-success .feedback-icon { color: #28a745; animation: feedback-pop 0.35s ease; }
        .feedback-overlay.state-fail    .feedback-icon { color: #DC3545; animation: feedback-pop 0.35s ease; }
        @keyframes feedback-pop {
            0%   { transform: scale(0.3); opacity: 0; }
            60%  { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); }
        }

        .feedback-title    { font-size: 28px; font-weight: bold; margin-bottom: 8px; }
        .feedback-overlay.state-success .feedback-title { color: #1e7e34; }
        .feedback-overlay.state-fail    .feedback-title { color: #a71d2a; }
        .feedback-subtitle { font-size: 18px; color: #333; margin-bottom: 8px; }

        .feedback-dots { display: none; gap: 10px; justify-content: center; margin: 16px 0 4px; }
        .feedback-overlay.state-loading .feedback-dots { display: flex; }
        .feedback-dots .dot {
            width: 14px; height: 14px; border-radius: 50%;
            background: #6610f2;
            animation: feedback-bounce 1.1s infinite ease-in-out both;
        }
        .feedback-dots .dot:nth-child(1) { animation-delay: -0.24s; }
        .feedback-dots .dot:nth-child(2) { animation-delay: -0.12s; }
        .feedback-dots .dot:nth-child(3) { animation-delay: 0s; }
        @keyframes feedback-bounce {
            0%, 80%, 100% { transform: scale(0.5); opacity: 0.5; }
            40%           { transform: scale(1); opacity: 1; }
        }

        .feedback-actions { display: none; gap: 12px; justify-content: center; margin-top: 20px; }
        .feedback-overlay.state-fail .feedback-actions { display: flex; }
        .feedback-btn { padding: 14px 20px; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: #fff; }
        .feedback-retry   { background: #6610f2; }
        .feedback-dismiss { background: #6c757d; }
        .feedback-btn:hover { opacity: 0.85; }
        .feedback-overlay.no-retry .feedback-retry { display: none; }

        .toggle-link-btn {
            display: inline-block;
            width: auto;
            background: none;
            color: #007BFF;
            font-size: 16px;
            font-weight: normal;
            text-decoration: underline;
            padding: 8px 4px;
            margin-top: 4px;
            border-radius: 0;
        }
        .toggle-link-btn:hover {
            opacity: 1;
            color: #0056b3;
        }
    </style>
</head>
<body>

<script>
    // Google Apps Script web app URL — the script holds the Airtable API key server-side
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz6tYaqU3AmBwxFJ5SIXfNgQyE8YntnxvkgUCTBURCVuEBGYvypjzqRDwo3C_PJu_pVcg/exec";

    // Maps the ?location= URL slug to the full location name used in QUESTIONS
    // and stored in Airtable. Add an entry here for each kiosk.
    const LOCATION_SLUGS = {
      'bvac101': 'BVAC 101',
      'woodshop':    'Wood Shop',
      'hammond': 'Hammond',
      'metal':       'Metal Fabrication',
      'sewing':      'Sewing Studio',
      'moldmaking':  'Mold Making Studio',
      'glass':   'Glass Studio',
      //'printmaking': 'Printmaking Studio',
      // 'bvac135':     'BVAC 135',
    };

    // Airtable record IDs (Studios table) for the "Link to Studios" field.
    // Get a record ID from Airtable: open the record, "Copy record ID" from
    // the row's expand menu.
    const STUDIO_RECORD_IDS = {
      WOOD:   "recEmA7YmwAZYwy4t", // Wood
      DGFB:   "rec8ZDPeTm5oqfTmm", // Digital Fabrication
      LTPR:   "recL1LMpU7M5QqX8T", // Letterpress
      MTFB:   "recrjrza3kuEIHDZJ", // Metal Fabrication
      MOLD:   "recA9LO7TKzBxfJ05", // Mold Making
      SEWI:   "recAfbaDwT6mX5ptQ", // Sewing
      GLSS:   "reczmauO2vp8nCTSH", // Glass
      PRNT:   "recBRAr0RfMUqk7Ub" // Printmaking
    };

    // Read from ?location=<slug> in the page URL
    const LOCATION_SLUG = new URLSearchParams(window.location.search).get('location');
    const LOCATION = LOCATION_SLUGS[LOCATION_SLUG] || null;

    // ?kiosk=true switches on the fixed-screen, ID-scan-first kiosk preset.
    // Default (no param, e.g. QR code links) is the phone preset: scrollable
    // layout, email entry first.
    const KIOSK_MODE = new URLSearchParams(window.location.search).get('kiosk') === 'true';
    if (KIOSK_MODE) document.documentElement.classList.add('kiosk-mode');
    const DEFAULT_USING_EMAIL = !KIOSK_MODE;
</script>

<!-- ============================================================

<div id="kiosk-wrapper">

<br>
<button type="button" id="idModeToggle" class="toggle-link-btn" onclick="toggleIdMode()">I don't have my ID</button>

<h2>What brings you in today?</h2>
<div class="button-container">
    <button class="personal-btn reason-btn" onclick="selectReason(this, 'Personal Project')">Personal Project</button>
    <button class="academic-btn reason-btn" onclick="selectReason(this, 'Academic Project')">Academic Project</button>

</div>

<div id="feedbackOverlay" class="feedback-overlay" role="alert" aria-live="assertive">

    </div>

<span> <p id="locationTitle"></p></span>

<script>
// ----------------------------------------------------------
// QUESTIONS DATA MODEL
// Add or remove locations/questions here as needed. Use the following format:
// "Location Name": [ { question: "Question text?", field: "Airtable Field Name (must match exactly!)", answers: ["Option 1", "Option 2"] }, ... ]
// ----------------------------------------------------------
const QUESTIONS = {
    "BVAC 101": [
        {
            question: "What Letterpress equipment are you using?",
            field: "Letterpress Equipment",
            answers: ["Typesetting", "Presses", "Risograph", { label: "Guillotine/<br>Paper Cutter/<br>Board Shear", value: "Guillotine/Paper Cutter/Board Shear" }, "Bindery"]
        },
        {
            question: "What Digital Fabrication Equipment are you using?",
            field: "Digifab Equipment",
            answers: ["Filament 3D Printer", "Resin 3D Printer", "Laser Cutter", "3D Scanner",{ label: "Vinyl Cutter/<br>Cricut", value: "Vinyl Cutter/Cricut" }, "Vacuum Former", "CNC Mill"]
        }
    ],
    "Glass Studio": [
        {
            question: "Which shop are you using?",
            field: "Glass Shop",
            answers: ["Hot Shop", "Cold Shop"]
        }
    ],
    "Hammond": [
        {
            // field: "Location" + type: "single" is a special combo: the selected
            // studio overwrites the generic LOCATION value sent to Airtable (see
            // submitForm's payload spread). Never pair field: "Location" with the
            // default multi-select type, or an array gets written into Location.
            question: "Which studio are you using?",
            field: "Location",
            type: "single",
            required: true,
            answers: ["Metal Fabrication", "Mold Making Studio", "Sewing Studio"]
        }
    ],
};

// Maps a location's full name to the Studio record(s) it links to in
// Airtable. Keys must exactly match LOCATION_SLUGS / QUESTIONS full names
// (same rule as documented for QUESTIONS). BVAC101 is handled separately
// in getStudioRecordIds() since its studio depends on equipment answers,
// not the location alone.
const LOCATION_STUDIOS = {
    "Wood Shop":          [STUDIO_RECORD_IDS.WOOD],
    "Glass Studio":       [STUDIO_RECORD_IDS.GLSS],
    "Metal Fabrication":  [STUDIO_RECORD_IDS.MTFB],
    "Mold Making Studio": [STUDIO_RECORD_IDS.MOLD],
    "Sewing Studio":      [STUDIO_RECORD_IDS.SEWI],
};

// ----------------------------------------------------------
// STATE
// ----------------------------------------------------------
let selectedReason = null;
let usingEmail = DEFAULT_USING_EMAIL;
const answers = {};  // { "Question text": "Selected answer" }
const RINGLING_EMAIL_PATTERN = /^[^\s@]+@(ringling\.edu|c\.ringling\.edu)$/i;

// ----------------------------------------------------------
// AUDIO FEEDBACK (Web Audio API, synthesized tones — no audio files)
// ----------------------------------------------------------
let audioCtx = null;

// Created/resumed lazily. Must be called synchronously from a user-gesture
// handler (e.g. the very top of submitForm(), before any `await`) so Safari/
// Chrome's autoplay-unlock rules are satisfied.
function getAudioContext() {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return null;
    if (!audioCtx) audioCtx = new AudioContextClass();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
}

function playTone(ctx, freq, startTime, duration, type, peakGain) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, startTime);
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(peakGain, startTime + 0.015);        // short attack, no click
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);  // smooth decay
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.02);
}

function playSuccessChime() {
    const ctx = getAudioContext();
    if (!ctx) return;
    const now = ctx.currentTime;
    playTone(ctx, 880.00, now,        0.16, 'sine', 0.18); // A5
    playTone(ctx, 1174.66, now + 0.14, 0.22, 'sine', 0.18); // D6, ascending
}

function playFailureTone() {
    const ctx = getAudioContext();
    if (!ctx) return;
    const now = ctx.currentTime;
    playTone(ctx, 220.00, now,        0.28, 'square', 0.12); // A3
    playTone(ctx, 174.61, now + 0.24, 0.32, 'square', 0.12); // F3, descending buzz
}

// ----------------------------------------------------------
// FULL-SCREEN FEEDBACK OVERLAY
// ----------------------------------------------------------
let successDismissTimer = null;

function showOverlay(state, { icon = '', title = '', subtitle = '', retry = true } = {}) {
    const overlay = document.getElementById('feedbackOverlay');
    overlay.classList.remove('state-loading', 'state-success', 'state-fail');
    overlay.classList.add('state-' + state, 'visible');
    overlay.classList.toggle('no-retry', !retry);
    document.getElementById('feedbackIcon').textContent = icon;
    document.getElementById('feedbackTitle').textContent = title;
    document.getElementById('feedbackSubtitle').textContent = subtitle;
}

// Client-side validation problems (bad email, missing answers, etc.) reuse the
// same prominent red overlay as a submit failure, minus Retry — there's no
// network call to retry, the visitor just needs to fix the field and resubmit.
function showValidationError(message) {
    const statusEl = document.getElementById("statusMsg");
    statusEl.style.color = "red";
    statusEl.textContent = message;
    playFailureTone();
    showOverlay('fail', {
        icon: '✗',
        title: 'Please check your info',
        subtitle: message,
        retry: false
    });
}

function hideOverlay() {
    document.getElementById('feedbackOverlay').classList.remove('visible');
    if (successDismissTimer) {
        clearTimeout(successDismissTimer);
        successDismissTimer = null;
    }
}

// Failure overlay "Dismiss": close it, leave the form exactly as-is for editing/resubmit
function dismissOverlay() {
    hideOverlay();
}

// Failure overlay "Retry": close it and resubmit immediately with current field values
function retrySubmit() {
    hideOverlay();
    submitForm();
}

// ----------------------------------------------------------
// APPS SCRIPT WARM-UP PING
// A GET with no `data` param hits Code.gs's early-return path (see doGet),
// which never touches Airtable — safe to call repeatedly. cache: 'no-store'
// keeps the browser from serving a cached response instead of actually
// round-tripping to Apps Script, which would defeat the point.
// ----------------------------------------------------------
const WARM_UP_INTERVAL_MS = 4 * 60 * 1000; // 4 minutes: shorter than Apps Script's idle window
let warmUpIntervalId = null;

function pingWarmUp() {
    fetch(APPS_SCRIPT_URL, { cache: 'no-store' }).catch(() => {}); // fire-and-forget
}

function startWarmUpPings() {
    if (warmUpIntervalId) return;
    pingWarmUp();
    warmUpIntervalId = setInterval(pingWarmUp, WARM_UP_INTERVAL_MS);
}

function stopWarmUpPings() {
    if (warmUpIntervalId) {
        clearInterval(warmUpIntervalId);
        warmUpIntervalId = null;
    }
}

document.addEventListener('visibilitychange', () => {
    if (document.hidden) stopWarmUpPings();
    else startWarmUpPings();
});

// ----------------------------------------------------------
// VIEWPORT SCALING — keeps all content on-screen without scrolling
// ----------------------------------------------------------
function scaleKiosk() {
    if (!KIOSK_MODE) return;
    const wrapper = document.getElementById('kiosk-wrapper');
    wrapper.style.transform = 'scale(1)';
    const scale = Math.min(
        window.innerWidth  / wrapper.scrollWidth,
        window.innerHeight / wrapper.scrollHeight
    );
    if (scale < 1) wrapper.style.transform = `scale(${scale})`;
}
window.addEventListener('resize', scaleKiosk);

// ----------------------------------------------------------
// REASON SELECTION
// ----------------------------------------------------------
function selectReason(btn, reason) {
    selectedReason = reason;
    document.querySelectorAll('.reason-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
}

// ----------------------------------------------------------
// RENDER QUESTIONS for the current LOCATION only
// ----------------------------------------------------------
window.onload = function () {
    if (!LOCATION) {
        renderInvalidLocation();
        return;
    }
    document.getElementById("locationTitle").textContent = LOCATION;
    applyInputMode();
    document.getElementById("numberInput").focus();
    renderQuestions();
    scaleKiosk();
    startWarmUpPings();
};

// ----------------------------------------------------------
// ID / EMAIL MODE TOGGLE
// ----------------------------------------------------------
function applyInputMode() {
    const input = document.getElementById('numberInput');
    const toggleBtn = document.getElementById('idModeToggle');

    if (usingEmail) {
        input.type = 'email';
        input.placeholder = 'Enter Ringling Email';
        input.removeAttribute('minlength');
        input.removeAttribute('maxlength');
        input.setAttribute('inputmode', 'email');
        toggleBtn.textContent = 'Scan ID Instead';
    } else {
        input.type = 'text';
        input.placeholder = 'Scan Your ID';
        input.setAttribute('minlength', '6');
        input.setAttribute('maxlength', '20');
        input.setAttribute('inputmode', 'none');
        toggleBtn.textContent = "Use Email Instead";
    }
}

function toggleIdMode() {
    usingEmail = !usingEmail;
    applyInputMode();
    const input = document.getElementById('numberInput');
    input.value = '';
    input.focus();
}

function renderInvalidLocation() {
    const wrapper = document.getElementById('kiosk-wrapper');
    wrapper.innerHTML = `
        <h2>Unknown or missing "location" parameter.</h2>
        <p>Valid options: ${Object.keys(LOCATION_SLUGS).join(', ')}</p>
    `;
    scaleKiosk();
}

// Helper function to convert answer text to image filename
function answerToImageFilename(answer) {
    return answer
        .toLowerCase()
        .replace(/\s+/g, '-')
        .replace(/[^\w\-]/g, '-')
        .replace(/\-+/g, '-')
        .replace(/^\-|\-$/g, '') + '.jpg';
}

function renderQuestions() {
    const header = document.getElementById("questionsHeader");
    const container = document.getElementById("questionsContainer");
    container.innerHTML = "";

    const locationQs = QUESTIONS[LOCATION];
    if (!locationQs || locationQs.length === 0) {
        header.style.display = "none";
        return;
    }

    header.style.display = "block";
    locationQs.forEach((q, index) => {
        const block = document.createElement("div");
        const isSingle = q.type === "single";

        let html = `<h3>${q.question}</h3>`;
        html += `<div class="${isSingle ? "button-container" : "answer-buttons"}">`;

        q.answers.forEach(answer => {
            const value = typeof answer === 'object' ? answer.value : answer;
            const label = typeof answer === 'object' ? answer.label : answer;
            const safeId = `q${index}-${value}`.replace(/[^a-zA-Z0-9-_]/g, "_");

            if (isSingle) {
                html += `<button id="${safeId}" class="single-select-btn" onclick="recordAnswer('${q.field || q.question}', '${value}', '${index}', 'single')">${label}</button>`;
            } else {
                const imageUrl = `./images/${answerToImageFilename(value)}`;
                html += `<button id="${safeId}" style="background-image: url('${imageUrl}')" onclick="recordAnswer('${q.field || q.question}', '${value}', '${index}', 'multi')">${label}</button>`;
            }
        });

        html += `</div>`;
        block.innerHTML = html;
        container.appendChild(block);
    });
    scaleKiosk();
}

// ----------------------------------------------------------
// RECORD ANSWER
// ----------------------------------------------------------
function recordAnswer(question, answer, questionIndex, type) {
    if (type === 'single') {
        // Exclusive single-select: store a scalar, highlight only the clicked button
        answers[question] = answer;
        document.querySelectorAll(`[id^="q${questionIndex}-"]`).forEach(b => b.classList.remove('selected'));
        const safeId = `q${questionIndex}-${answer}`.replace(/[^a-zA-Z0-9-_]/g, "_");
        document.getElementById(safeId).classList.add('selected');
        return;
    }

    // Initialize as array if it doesnt exist
    if (!answers[question]) {
        answers[question] = [];
    }

    const index = answers[question].indexOf(answer);

    // Toggle: add if not present, remove if present
    if (index > -1) {
        answers[question].splice(index, 1);
    } else {
        answers[question].push(answer);
    }

    // Toggle button highlight
    const safeId = `q${questionIndex}-${answer}`.replace(/[^a-zA-Z0-9-_]/g, "_");
    document.getElementById(safeId).classList.toggle('selected');
}

// ----------------------------------------------------------
// STUDIO RESOLUTION
// ----------------------------------------------------------
function getStudioRecordIds() {
    if (LOCATION === "BVAC 101") {
        const hasLetterpress = Array.isArray(answers["Letterpress Equipment"]) && answers["Letterpress Equipment"].length > 0;
        const hasDigifab = Array.isArray(answers["Digifab Equipment"]) && answers["Digifab Equipment"].length > 0;

        // Both selected, or neither selected: link both studios.
        if (hasLetterpress === hasDigifab) {
            return [STUDIO_RECORD_IDS.LTPR, STUDIO_RECORD_IDS.DGFB];
        }
        return [hasLetterpress ? STUDIO_RECORD_IDS.LTPR : STUDIO_RECORD_IDS.DGFB];
    }

    // Hammond's sub-studio question overwrites answers["Location"] with the
    // specific studio actually used (see QUESTIONS.Hammond) — prefer that
    // over the generic LOCATION when present.
    const effectiveLocation = answers["Location"] || LOCATION;
    return LOCATION_STUDIOS[effectiveLocation] || [];
}

// ----------------------------------------------------------
// SUBMIT
// ----------------------------------------------------------
async function submitForm() {
    getAudioContext(); // create/unlock inside the click's user-gesture window, before any await
    const statusEl = document.getElementById("statusMsg");
    statusEl.style.color = "black";
    statusEl.textContent = "";

    const inputValue = document.getElementById("numberInput").value.trim();

    if (usingEmail) {
        if (!RINGLING_EMAIL_PATTERN.test(inputValue)) {
            showValidationError("Please enter a valid @ringling.edu or @c.ringling.edu email address.");
            return;
        }
    } else if (inputValue.length < 6) {
        showValidationError("ID must be at least 6 digits.");
        return;
    }

    if (!selectedReason) {
        showValidationError("Please select a reason for visit.");
        return;
    }

    const locationQs = QUESTIONS[LOCATION] || [];
    for (const q of locationQs) {
        if (!q.required) continue;
        const key = q.field || q.question;
        const val = answers[key];
        const answered = q.type === "single" ? !!val : Array.isArray(val) && val.length > 0;
        if (!answered) {
            showValidationError("Please answer: " + q.question);
            return;
        }
    }

    const extraQuestions = { ...answers };
    delete extraQuestions["Location"];

    const fields = {
        "Reason":           selectedReason,
        "Extra Questions":  JSON.stringify(extraQuestions, null, 2), // Keeping this for now as a plaintext version of the equipment questions.
        "Link to Studios":  getStudioRecordIds(),
        ...extraQuestions
    };

    if (usingEmail) {
        fields["Email"] = inputValue;
    } else {
        fields["ID Number"] = inputValue.slice(-6);
    }

    const payload = { fields };

    statusEl.textContent = "Submitting...";
    showOverlay('loading', { title: 'Submitting…', subtitle: 'Please wait a moment.' });

    try {
        // GET, not POST: Apps Script's /exec URL always 302-redirects to a
        // googleusercontent.com URL to deliver its response, and a browser
        // following that redirect downgrades POST to GET per the fetch spec,
        // silently dropping the body before it reaches the script. GET survives
        // the redirect intact, so the payload is sent as a query parameter.
        const url = APPS_SCRIPT_URL + "?data=" + encodeURIComponent(JSON.stringify(payload));
        const res = await fetch(url);
        const result = await res.json();

        if (!result.ok) {
            throw new Error(result.error || "Unknown error");
        }

        statusEl.style.color = "green";
        statusEl.textContent = "✓ Signed in! Enjoy your time in the shop!";
        playSuccessChime();
        showOverlay('success', {
            icon: '✓',
            title: 'Signed in!',
            subtitle: 'Enjoy your time in the shop.'
        });
        successDismissTimer = setTimeout(() => {
            hideOverlay();
            resetForm();
        }, 1800);

    } catch (e) {
        statusEl.style.color = "red";
        statusEl.textContent = "Error: " + e.message;
        console.error(e);
        playFailureTone();
        showOverlay('fail', {
            icon: '✗',
            title: 'Sign-in failed',
            subtitle: e.message || 'Something went wrong. Please try again.'
        });
    }
}

// ----------------------------------------------------------
// RESET
// ----------------------------------------------------------
function clearFields() {
    if (KIOSK_MODE) {
        usingEmail = false;  // shared kiosk: always default back to ID-scan for the next visitor
    }
    // phone preset: persist whichever mode this visitor last used
    applyInputMode();
    document.getElementById("numberInput").value = "";
    document.getElementById("numberInput").focus();
    document.getElementById("statusMsg").textContent = "";
    selectedReason = null;
    Object.keys(answers).forEach(k => delete answers[k]);
    document.querySelectorAll('.reason-btn, .answer-buttons button, .single-select-btn').forEach(b => b.classList.remove('selected'));
}

// Called once the success overlay's auto-dismiss timer fires
function resetForm() {
    clearFields();
}

// Called when the visitor taps Clear to start over without submitting
function clearForm() {
    clearFields();
}
</script>
</body>
</html>
